<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kuiper Satellites Overview</title>
  <style>
    body { margin: 0; background: black; }
    #time-log {
      position: absolute;
      font-size: 12px;
      font-family: sans-serif;
      padding: 5px;
      border-radius: 3px;
      background-color: rgba(200, 200, 200, 0.1);
      color: lavender;
      bottom: 10px;
      right: 10px;
    }
  </style>

  <!-- Globe.gl -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>

<body>
  <div id="chart"></div>
  <div id="time-log"></div>

  <script type="module">
    import * as satellite from 'https://esm.sh/satellite.js';

    const EARTH_RADIUS_KM = 6371; 
    const TIME_STEP = 10 * 1000;   // advance 10s per frame
    const ORBIT_MINUTES = 90;      // length of orbit track

    const timeLogger = document.getElementById('time-log');

    // Init globe
    const world = Globe()(document.getElementById('chart'))
      .globeImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
      .pointLat('lat')
      .pointLng('lng')
      .pointAltitude('alt')
      .pointColor(() => 'red')
      .pointRadius(0.6)
      .arcColor(() => ['cyan', 'cyan'])
      .arcAltitude(() => 0.15)
      .arcStroke(0.5)
      .backgroundColor('#000011');

    setTimeout(() => world.pointOfView({ altitude: 3 }));

    // Fetch Kuiper constellation TLEs
    fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=kuiper&FORMAT=tle')
      .then(r => r.text())
      .then(rawData => {
        const tleData = rawData.replace(/\r/g, '')
          .split(/\n(?=[^12])/)
          .filter(d => d)
          .map(tle => tle.split('\n'));

        const satData = tleData.map(([name, ...tle]) => ({
          satrec: satellite.twoline2satrec(...tle),
          name: name.trim().replace(/^0 /, '')
        }))
        .filter(d => !!satellite.propagate(d.satrec, new Date())?.position);

        function getPosition(satrec, date) {
          const pv = satellite.propagate(satrec, date);
          if (!pv.position) return null;
          const gmst = satellite.gstime(date);
          const geo = satellite.eciToGeodetic(pv.position, gmst);
          return {
            lat: satellite.radiansToDegrees(geo.latitude),
            lng: satellite.radiansToDegrees(geo.longitude),
            alt: geo.height / EARTH_RADIUS_KM
          };
        }

        // Time ticker
        let time = new Date();
        (function frameTicker() {
          requestAnimationFrame(frameTicker);

          time = new Date(+time + TIME_STEP);
          timeLogger.innerText = time.toUTCString();

          // Satellites as points
          const satMarkers = satData.map(sat => {
            const pos = getPosition(sat.satrec, time);
            return pos ? { lat: pos.lat, lng: pos.lng, alt: 0.02, name: sat.name } : null;
          }).filter(Boolean);

          // Orbit tracks as arcs (polyline segments)
          const satOrbits = satData.map(sat => {
            const orbit = [];
            for (let m = 0; m < ORBIT_MINUTES; m += 2) { // every 2 minutes
              const future = new Date(+time + m * 60 * 1000);
              const pos = getPosition(sat.satrec, future);
              if (pos) orbit.push([pos.lat, pos.lng, 0.002]);
            }
            return orbit.length > 1 ? { line: orbit } : null;
          }).filter(Boolean);

          world.pointsData(satMarkers);
          world.arcsData(satOrbits)
            .arcStartLat(d => d.line[0][0])
            .arcStartLng(d => d.line[0][1])
            .arcEndLat(d => d.line[d.line.length-1][0])
            .arcEndLng(d => d.line[d.line.length-1][1])
            .arcDashLength(0.9)
            .arcDashGap(0.05)
            .arcDashAnimateTime(4000);
        })();
      });
  </script>
</body>
</html>
