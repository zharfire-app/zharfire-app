<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Satellite Overview</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  #globeViz { width: 100vw; height: 100vh; }
  .info {
    position: fixed;
    top: 10px; left: 10px;
    color: white;
    font-family: Arial, sans-serif;
    background: rgba(0,0,0,0.5);
    padding: 8px 12px;
    border-radius: 6px;
  }
</style>
</head>
<body>
<div id="globeViz"></div>
<div class="info">Satellite Overview - Stations (CelesTrak)</div>

<!-- Libraries -->
<script src="https://unpkg.com/three/build/three.min.js"></script>
<script src="https://unpkg.com/three-globe"></script>
<script src="https://unpkg.com/satellite.js/dist/satellite.min.js"></script>

<script>
// --- Initialize Globe ---
const Globe = new ThreeGlobe()
  .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
  .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera();
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('globeViz').appendChild(renderer.domElement);
scene.add(Globe);

// Light
const light = new THREE.AmbientLight(0xffffff, 1.0);
scene.add(light);

// --- Fetch TLE data ---
fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle')
  .then(res => res.text())
  .then(data => {
    const satellites = parseTLEData(data);
    animateSatellites(satellites);
  });

// --- Parse TLE ---
function parseTLEData(data) {
  const lines = data.trim().split('\n');
  const sats = [];
  for (let i = 0; i < lines.length; i += 3) {
    const name = lines[i].trim();
    const line1 = lines[i+1].trim();
    const line2 = lines[i+2].trim();
    sats.push({name, line1, line2});
  }
  return sats;
}

// --- Convert TLE to Lat/Lon using satellite.js ---
function getSatellitePosition(satrec, date) {
  const positionAndVelocity = satellite.propagate(satrec, date);
  const gmst = satellite.gstime(date);
  const latLon = satellite.eciToGeodetic(positionAndVelocity.position, gmst);
  const lat = satellite.degreesLat(latLon.latitude);
  const lon = satellite.degreesLong(latLon.longitude);
  const alt = latLon.height;
  return {lat, lng: lon, alt};
}

// --- Animate satellites ---
function animateSatellites(sats) {
  // Create satellite records
  const satRecords = sats.map(s => satellite.twoline2satrec(s.line1, s.line2));
  const pointsData = satRecords.map(s => ({lat: 0, lng: 0, size: 5, color: 'red'}));
  Globe.pointsData(pointsData);

  function updatePositions() {
    const now = new Date();
    satRecords.forEach((s, i) => {
      const pos = getSatellitePosition(s, now);
      pointsData[i].lat = pos.lat;
      pointsData[i].lng = pos.lng;
    });
    Globe.pointsData(pointsData);
  }

  // Rotate camera slowly
  function animate() {
    requestAnimationFrame(animate);
    updatePositions();
    Globe.rotateY(0.001);
    renderer.render(scene, camera);
  }
  animate();
}

// --- Resize handler ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
