<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Constellation Viewer</title>
  <style>
    body { margin: 0; background: black; }
    #time-log {
      position: absolute;
      font-size: 12px;
      font-family: sans-serif;
      padding: 5px;
      border-radius: 3px;
      background-color: rgba(200, 200, 200, 0.1);
      color: lavender;
      bottom: 10px;
      right: 10px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <div id="chart"></div>
  <div id="time-log"></div>

  <script type="module">
    import * as satellite from 'https://esm.sh/satellite.js';

    const EARTH_RADIUS_KM = 6371;
    const TIME_STEP = 1 * 1000; // 1 sec/frame
    const ORBIT_STEP = 60; // seconds per sample along orbit
    const timeLogger = document.getElementById('time-log');

    const world = Globe()(document.getElementById('chart'))
      .globeImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
      .pointAltitude('alt')
      .pointColor(() => 'yellow')
      .pointRadius(0.4)
      .arcColor(() => ['cyan', 'cyan'])
      .arcAltitude(d => d.alt)
      .arcStroke(0.5);

    setTimeout(() => world.pointOfView({ altitude: 3.5 }));

    // helper to unwrap longitude
    function unwrapLng(lngArray) {
      let prev = lngArray[0];
      return lngArray.map(lng => {
        let diff = lng - prev;
        if (diff > 180) lng -= 360;
        if (diff < -180) lng += 360;
        prev = lng;
        return lng;
      });
    }

    // Load TLEs (example: Kuiper)
    fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=kuiper&FORMAT=tle')
      .then(r => r.text())
      .then(rawData => {
        const tleData = rawData.replace(/\r/g, '')
          .split(/\n(?=[^12])/)
          .filter(d => d)
          .map(tle => tle.split('\n'));

        const satData = tleData.map(([name, ...tle]) => ({
          satrec: satellite.twoline2satrec(...tle),
          name: name.trim().replace(/^0 /, '')
        })).filter(d => !!satellite.propagate(d.satrec, new Date())?.position);

        // compute orbits for each sat
        satData.forEach(d => {
          const coords = [];
          const lats = [], lngs = [], alts = [];
          const now = new Date();
          const gmst = satellite.gstime(now);

          for (let t = 0; t <= 90 * 60; t += ORBIT_STEP) { // ~90 min orbit
            const eci = satellite.propagate(d.satrec, new Date(+now + t * 1000));
            if (eci?.position) {
              const gd = satellite.eciToGeodetic(eci.position, gmst);
              lats.push(satellite.radiansToDegrees(gd.latitude));
              lngs.push(satellite.radiansToDegrees(gd.longitude));
              alts.push(gd.height / EARTH_RADIUS_KM);
            }
          }

          const smoothLngs = unwrapLng(lngs);
          for (let i = 0; i < lats.length; i++) {
            coords.push({
              lat: lats[i],
              lng: smoothLngs[i],
              alt: alts[i]
            });
          }
          d.orbit = coords;
        });

        // Set arcs for orbits
        const arcs = satData.flatMap(d => {
          const pairs = [];
          for (let i = 0; i < d.orbit.length - 1; i++) {
            pairs.push({
              startLat: d.orbit[i].lat,
              startLng: d.orbit[i].lng,
              endLat: d.orbit[i+1].lat,
              endLng: d.orbit[i+1].lng,
              alt: d.orbit[i].alt
            });
          }
          return pairs;
        });

        world.arcsData(arcs);

        // Animate satellites
        let time = new Date();
        (function frameTicker() {
          requestAnimationFrame(frameTicker);
          time = new Date(+time + TIME_STEP);
          timeLogger.innerText = time.toString();

          const gmst = satellite.gstime(time);
          satData.forEach(d => {
            const eci = satellite.propagate(d.satrec, time);
            if (eci?.position) {
              const gd = satellite.eciToGeodetic(eci.position, gmst);
              d.lat = satellite.radiansToDegrees(gd.latitude);
              d.lng = satellite.radiansToDegrees(gd.longitude);
              d.alt = gd.height / EARTH_RADIUS_KM;
            }
          });

          world.pointsData(satData.filter(d => !isNaN(d.lat)));
        })();
      });
  </script>
</body>
</html>
