<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Orbit Path</title>
  <style>
    body { margin: 0; background: black; }
    #chart { width: 100vw; height: 100vh; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <div id="chart"></div>

  <script type="module">
    import * as satellite from 'https://esm.sh/satellite.js';

    const EARTH_RADIUS_KM = 6371;
    const TIME_STEP = 1000; // ms

    const world = Globe()(document.getElementById('chart'))
      .globeImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
      .pointLat('lat')
      .pointLng('lng')
      .pointAltitude('alt')
      .pointColor(() => 'yellow')
      .pointRadius(0.8)
      .pathPoints('coords')
      .pathPointLat('lat')
      .pathPointLng('lng')
      .pathPointAlt('alt')
      .pathColor(() => 'orange')
      .pathStroke(1.5);

    setTimeout(() => world.pointOfView({ altitude: 3.5 }));

    // Example: ISS TLE
    const tleLine1 = "1 25544U 98067A   23275.54667824  .00017264  00000+0  30762-3 0  9993";
    const tleLine2 = "2 25544  51.6436  88.6318 0003252  79.8965  34.0224 15.50050624417627";
    const satrec = satellite.twoline2satrec(tleLine1, tleLine2);

    // Build orbit polyline (90 min sampled every 60s)
    function buildOrbit(startTime) {
      const coords = [];
      for (let t = 0; t < 90 * 60; t += 60) {
        const time = new Date(startTime.getTime() + t * 1000);
        const eci = satellite.propagate(satrec, time);
        if (eci.position) {
          const gmst = satellite.gstime(time);
          const gdPos = satellite.eciToGeodetic(eci.position, gmst);
          coords.push({
            lat: satellite.radiansToDegrees(gdPos.latitude),
            lng: satellite.radiansToDegrees(gdPos.longitude),
            alt: gdPos.height / EARTH_RADIUS_KM
          });
        }
      }
      return coords;
    }

    const now = new Date();
    const orbitPath = buildOrbit(now);

    // Draw orbit line
    world.pathsData([{ coords: orbitPath }]);

    // Satellite point
    let satPoint = [{ lat: orbitPath[0].lat, lng: orbitPath[0].lng, alt: orbitPath[0].alt }];
    world.pointsData(satPoint);

    // Animate satellite
    let simTime = new Date();
    (function frame() {
      requestAnimationFrame(frame);
      simTime = new Date(simTime.getTime() + TIME_STEP);

      const eci = satellite.propagate(satrec, simTime);
      if (eci.position) {
        const gmst = satellite.gstime(simTime);
        const gdPos = satellite.eciToGeodetic(eci.position, gmst);
        satPoint[0] = {
          lat: satellite.radiansToDegrees(gdPos.latitude),
          lng: satellite.radiansToDegrees(gdPos.longitude),
          alt: gdPos.height / EARTH_RADIUS_KM
        };
        world.pointsData(satPoint);
      }
    })();

  </script>
</body>
</html>
