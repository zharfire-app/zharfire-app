<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Orbit Path + Moving Satellite</title>
  <style>
    body { margin: 0; background: #000; }
    #chart { width: 100vw; height: 100vh; }
    #time-log {
      position: absolute; bottom: 10px; right: 10px;
      font: 12px/1.2 system-ui, sans-serif; color: #cfd8ff;
      background: rgba(255,255,255,.08); padding: 6px 8px; border-radius: 6px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <div id="chart"></div>
  <div id="time-log"></div>

  <script type="module">
    import * as satellite from 'https://esm.sh/satellite.js';

    const EARTH_RADIUS_KM = 6371;
    const TIME_STEP_MS = 1000;          // animation step
    const ORBIT_SAMPLE_STEP_S = 60;     // sample every 60s along orbit

    const timeLogger = document.getElementById('time-log');

    const world = Globe()(document.getElementById('chart'))
      .globeImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
      // moving satellite marker
      .pointLat('lat')
      .pointLng('lng')
      .pointAltitude('alt')
      .pointColor(() => 'yellow')
      .pointRadius(0.7)
      // 3D orbit polyline
      .pathPoints('coords')
      .pathPointLat('lat')
      .pathPointLng('lng')
      .pathPointAlt('alt')
      .pathColor(() => 'orange')
      .pathStroke(1.5);

    setTimeout(() => world.pointOfView({ altitude: 3.5 }), 800);

    // ---- Choose a constellation here (example: Kuiper) ----
    const TLE_URL = 'https://celestrak.org/NORAD/elements/gp.php?GROUP=kuiper&FORMAT=tle';
    // -------------------------------------------------------

    // Build a 3D orbit polyline (lat,lng,alt) for one full period
    function buildOrbit3D(satrec, startTime) {
      // Estimate period from mean motion (satrec.no is rad/min)
      const no_rad_per_min = satrec.no;                       // rad/min
      const period_s = no_rad_per_min ? (2 * Math.PI / no_rad_per_min) * 60 : 90 * 60;

      const coords = [];
      for (let t = 0; t <= period_s; t += ORBIT_SAMPLE_STEP_S) {
        const time = new Date(startTime.getTime() + t * 1000);
        const pv = satellite.propagate(satrec, time);
        if (!pv?.position) continue;

        const gmst = satellite.gstime(time); // IMPORTANT: compute per sample
        const gd = satellite.eciToGeodetic(pv.position, gmst);

        coords.push({
          lat: satellite.radiansToDegrees(gd.latitude),
          lng: satellite.radiansToDegrees(gd.longitude),
          alt: gd.height / EARTH_RADIUS_KM
        });
      }

      // Option 2: close the loop by repeating the first point at the end
      if (coords.length > 1) coords.push({ ...coords[0] });

      return coords;
    }

    // Fetch TLEs, show first satellite’s orbit + moving dot (expand as needed)
    fetch(TLE_URL)
      .then(r => r.text())
      .then(raw => {
        const tleSets = raw.replace(/\r/g, '')
          .split(/\n(?=[^12])/).filter(Boolean)
          .map(block => block.split('\n'));

        // Use the first good sat as a demo (you can loop them all)
        const entry = tleSets.find(lines => lines.length >= 3);
        const name = entry[0].trim().replace(/^0 /, '');
        const satrec = satellite.twoline2satrec(entry[1], entry[2]);

        // Build and render orbit path
        const now = new Date();
        const orbitCoords = buildOrbit3D(satrec, now);
        world.pathsData([{ name, coords: orbitCoords }]);

        // Moving point (floating)
        const satPoint = [{ lat: orbitCoords[0].lat, lng: orbitCoords[0].lng, alt: orbitCoords[0].alt }];
        world.pointsData(satPoint);

        // Animate
        let simTime = new Date();
        (function tick() {
          requestAnimationFrame(tick);
          simTime = new Date(simTime.getTime() + TIME_STEP_MS);
          timeLogger.textContent = simTime.toUTCString();

          const pv = satellite.propagate(satrec, simTime);
          if (!pv?.position) return;
          const gmst = satellite.gstime(simTime);
          const gd = satellite.eciToGeodetic(pv.position, gmst);

          satPoint[0].lat = satellite.radiansToDegrees(gd.latitude);
          satPoint[0].lng = satellite.radiansToDegrees(gd.longitude);
          satPoint[0].alt = gd.height / EARTH_RADIUS_KM;

          // Reassign same reference to trigger refresh
          world.pointsData(world.pointsData());
        })();
      });
  </script>
</body>
</html>
