<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kuiper Satellites Overview</title>
  <style>
    body { margin: 0; background: black; }

    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: sans-serif;
      font-size: 14px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 5px;
    }

    #time-log {
      position: absolute;
      font-size: 12px;
      font-family: sans-serif;
      padding: 5px;
      border-radius: 3px;
      background-color: rgba(200, 200, 200, 0.1);
      color: lavender;
      bottom: 10px;
      right: 10px;
    }
  </style>

  <!-- Globe.gl -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <div id="chart"></div>
  <div id="controls">
    <label>
      <input type="checkbox" id="toggleKuiper" />
      Highlight Kuiper Satellites
    </label>
  </div>
  <div id="time-log"></div>

  <script type="module">
    import * as satellite from 'https://esm.sh/satellite.js';

    const EARTH_RADIUS_KM = 6371;
    const TIME_STEP = 1000;
    const timeLogger = document.getElementById('time-log');
    const toggleKuiper = document.getElementById('toggleKuiper');

    let highlightKuiper = false;

    const world = Globe()(document.getElementById('chart'))
      .globeImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
      .particleLat('lat')
      .particleLng('lng')
      .particleAltitude('alt')
      .particlesColor(() => highlightKuiper ? 'yellow' : 'palegreen')
      .particlesSize(2.5)   // make particles bigger (default is ~1)
      .particlesResolution(8); // smoother round particles

    setTimeout(() => world.pointOfView({ altitude: 3.5 }));

    toggleKuiper.addEventListener('change', () => {
      highlightKuiper = toggleKuiper.checked;
      world.particlesColor(() => highlightKuiper ? 'yellow' : 'palegreen');
      world.particlesSize(highlightKuiper ? 4 : 2.5);
    });

    fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=kuiper&FORMAT=tle')
      .then(r => r.text())
      .then(rawData => {
        const tleData = rawData.replace(/\r/g, '')
          .split(/\n(?=[^12])/)
          .filter(d => d)
          .map(tle => tle.split('\n'));

        const satData = tleData.map(([name, ...tle]) => ({
          satrec: satellite.twoline2satrec(...tle),
          name: name.trim().replace(/^0 /, '')
        }))
        .filter(d => !!satellite.propagate(d.satrec, new Date())?.position);

        let time = new Date();
        (function frameTicker() {
          requestAnimationFrame(frameTicker);
          time = new Date(+time + TIME_STEP);
          timeLogger.innerText = time.toUTCString();

          const gmst = satellite.gstime(time);
          satData.forEach(d => {
            const eci = satellite.propagate(d.satrec, time);
            if (eci?.position) {
              const gdPos = satellite.eciToGeodetic(eci.position, gmst);
              d.lat = satellite.radiansToDegrees(gdPos.latitude);
              d.lng = satellite.radiansToDegrees(gdPos.longitude);
              d.alt = gdPos.height / EARTH_RADIUS_KM;
            } else {
              d.lat = NaN; d.lng = NaN; d.alt = NaN;
            }
          });

          world.particlesData([
            satData.filter(d => !isNaN(d.lat) && !isNaN(d.lng) && !isNaN(d.alt))
          ]);
        })();
      });
  </script>
</body>
</html>
