<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kuiper Satellites – TLE</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #chart { width: 100%; height: 100%; }
    #time-log {
      position: fixed; right: 10px; bottom: 10px;
      font: 12px/1.2 system-ui, sans-serif; color: #cfd8ff;
      background: rgba(255,255,255,0.06); padding: 6px 8px; border-radius: 6px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <div id="chart"></div>
  <div id="time-log"></div>

  <script type="module">
    import * as satellite from 'https://esm.sh/satellite.js';

    const EARTH_RADIUS_KM = 6371;
    const STEP_MS = 1000;

    const world = Globe()(document.getElementById('chart'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .showAtmosphere(true)
      .atmosphereColor('#7aa9ff')
      .atmosphereAltitude(0.25)
      .backgroundColor('#000000')
      .pointLat('lat')
      .pointLng('lng')
      .pointAltitude('alt')
      .pointColor(() => 'yellow')
      .pointRadius(2.5)
      .pointResolution(16);

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.3;
    setTimeout(() => world.pointOfView({ altitude: 3.5 }), 1000);

    function getPosLLA(satrec, date) {
      const pv = satellite.propagate(satrec, date);
      if (!pv?.position) return null;
      const gmst = satellite.gstime(date);
      const gd = satellite.eciToGeodetic(pv.position, gmst);
      return {
        lat: satellite.degreesLat(gd.latitude),
        lng: satellite.degreesLong(gd.longitude),
        altFrac: (gd.height || 0) / EARTH_RADIUS_KM
      };
    }

    // Example: fetch Kuiper satellites from CelesTrak (replace URL if needed)
    const TLE_URL = 'https://celestrak.org/NORAD/elements/gp.php?GROUP=kuiper&FORMAT=TLE';

    fetch(TLE_URL)
      .then(r => r.text())
      .then(text => {
        const lines = text.split('\n').filter(l => l.trim().length > 0);
        const sats = [];

        // Each satellite is 3 lines: name, line1, line2
        for (let i = 0; i < lines.length; i += 3) {
          sats.push({
            name: lines[i].trim(),
            satrec: satellite.twoline2satrec(lines[i+1], lines[i+2])
          });
        }

        let simTime = new Date();
        const markers = sats.map(_ => ({ lat: 0, lng: 0, alt: 0 }));
        world.pointsData(markers);

        function tick() {
          requestAnimationFrame(tick);
          simTime = new Date(simTime.getTime() + STEP_MS);
          document.getElementById('time-log').textContent = simTime.toUTCString();

          sats.forEach((s, i) => {
            const p = getPosLLA(s.satrec, simTime);
            if (p) {
              markers[i].lat = p.lat;
              markers[i].lng = p.lng;
              markers[i].alt = Math.max(p.altFrac, 0.02);
            }
          });

          world.pointsData(markers);
        }

        tick();
      });
  </script>
</body>
</html>
