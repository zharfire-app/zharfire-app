<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kuiper Satellites Overview</title>
  <style>
    body { margin: 0; background: black; }
    #time-log {
      position: absolute;
      font-size: 12px;
      font-family: sans-serif;
      padding: 5px;
      border-radius: 3px;
      background-color: rgba(200, 200, 200, 0.1);
      color: lavender;
      bottom: 10px;
      right: 10px;
    }
  </style>

  <!-- Globe.gl -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
</head>
<body>
  <div id="chart"></div>
  <div id="time-log"></div>

  <script type="module">
    import * as satellite from 'https://esm.sh/satellite.js';

    const EARTH_RADIUS_KM = 6371; // km
    const TIME_STEP = 1 * 1000;   // 1 sec/frame
    const timeLogger = document.getElementById('time-log');

    const world = Globe()(document.getElementById('chart'))
      .globeImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
      .pointLat('lat')
      .pointLng('lng')
      .pointAltitude('alt')
      .pointColor(() => 'palegreen')
      .pointRadius(0.6)
      .pathPoints('coords')
      .pathColor(() => 'rgba(173,216,230,0.3)')
      .pathStroke(0.6);

    setTimeout(() => world.pointOfView({ altitude: 3.5 }));

    // Fetch TLEs
    fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=kuiper&FORMAT=tle')
      .then(r => r.text())
      .then(rawData => {
        const tleData = rawData.replace(/\r/g, '')
          .split(/\n(?=[^12])/)
          .filter(d => d)
          .map(tle => tle.split('\n'));

        const satData = tleData.map(([name, ...tle]) => ({
          satrec: satellite.twoline2satrec(...tle),
          name: name.trim().replace(/^0 /, '')
        }))
        .filter(d => !!satellite.propagate(d.satrec, new Date())?.position);

        // ---- 1. GROUP SATS BY INCLINATION ----
        const planes = {};
        satData.forEach(d => {
          const incl = d.satrec.inclo * (180 / Math.PI); // radians → deg
          const key = Math.round(incl); // group by ~1° buckets
          if (!planes[key]) planes[key] = [];
          planes[key].push(d);
        });

        // ---- 2. BUILD GREAT CIRCLES FOR EACH PLANE ----
        const planePaths = [];
        Object.entries(planes).forEach(([incl]) => {
          const coords = [];
          for (let lon = -180; lon <= 180; lon += 5) {
            coords.push([+incl, lon, 1.0]);   // northern arc
            coords.push([-incl, lon, 1.0]);  // mirrored southern arc
          }
          planePaths.push({ coords });
        });

        world.pathsData(planePaths);

        // ---- 3. TIME TICKER FOR SATS ----
        let time = new Date();
        (function frameTicker() {
          requestAnimationFrame(frameTicker);
          time = new Date(+time + TIME_STEP);
          timeLogger.innerText = time.toUTCString();

          const gmst = satellite.gstime(time);
          satData.forEach(d => {
            const eci = satellite.propagate(d.satrec, time);
            if (eci?.position) {
              const gd = satellite.eciToGeodetic(eci.position, gmst);
              d.lat = satellite.radiansToDegrees(gd.latitude);
              d.lng = satellite.radiansToDegrees(gd.longitude);
              d.alt = gd.height / EARTH_RADIUS_KM;
            } else {
              d.lat = NaN;
              d.lng = NaN;
              d.alt = NaN;
            }
          });

          world.pointsData(
            satData.filter(d => !isNaN(d.lat) && !isNaN(d.lng) && !isNaN(d.alt))
          );
        })();
      });
  </script>
</body>
</html>
