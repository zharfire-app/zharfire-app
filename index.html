<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satellite Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #121212; /* dark background */
      color: #f0f0f0;
    }

    /* Title panel */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2c2c2c; /* gray contrast */
      padding: 15px 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      color: #f0f0f0;
    }

    /* Top buttons */
    .top-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-buttons a {
      background: #007acc;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .top-buttons a:hover {
      background: #005f99;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    }

    /* Main grid */
    main {
      margin: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1e1e1e; /* dark card */
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
      background: #2a2a2a; /* slightly brighter on hover */
    }

    .card h3 {
      margin-top: 0;
      color: #f0f0f0;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 8px;
      background: #000;
    }

    /* Responsive adjustments for mobile */
    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .top-buttons {
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Satellite Dashboard</h1>
    <div class="top-buttons">
      <a href="index2.html">✨ New View</a>
      <a href="overview.html">📊 Overview</a>
    </div>
  </header>

  <main>
    <div class="grid">
      <div class="card"><h3>🌍 Globe View</h3><iframe src="globe_tracks.html"></iframe></div>
      <div class="card"><h3>🛰 Ground Tracks</h3><iframe src="ground_tracks.html"></iframe></div>
      <div class="card"><h3>📈 Altitude History</h3><iframe src="historical_orbital_parameters.html"></iframe></div>
      <div class="card"><h3>🗂 Satellite Category</h3><iframe src="satellite_altitude_by_category.html"></iframe></div>
      <div class="card"><h3>🌌 Orbital Distribution</h3><iframe src="orbital_distributions_titles_higher.html"></iframe></div>
      <div class="card"><h3>⭐ Interactive Starlink Plot</h3><iframe src="starlink_interactive_satellite_plot.html"></iframe></div>
    </div>
  </main>

</body>
</html>
