<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Satellite Dashboard – New View</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #121212;
      color: #f0f0f0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2c2c2c;
      padding: 15px 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      color: #f0f0f0;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-buttons a {
      background: #007acc;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .top-buttons a:hover {
      background: #005f99;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    }

    /* Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0 0 0;
      gap: 5px;
    }

    .tabs button {
      padding: 12px 20px;
      background: #1e1e1e;
      color: #f0f0f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s, transform 0.2s;
    }

    .tabs button.active {
      background: #007acc;
      color: white;
    }

    .tabs button:hover {
      background: #2a2a2a;
    }

    /* Tab content */
    .tab-content {
      display: none;
      padding: 20px;
      transition: opacity 0.3s ease;
    }

    .tab-content.active {
      display: block;
      opacity: 1;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 8px;
      background: #000;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .tab-content iframe:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      filter: brightness(1.1);
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .top-buttons {
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Satellite Dashboard – New View</h1>
  <div class="top-buttons">
    <a href="index.html">🏠 Main Grid</a>
    <a href="overview.html">📊 Overview</a>
  </div>
</header>

<div class="tabs">
  <button class="active" onclick="showTab('globe')">🌍 Globe View</button>
  <button onclick="showTab('ground')">🛰 Ground Tracks</button>
  <button onclick="showTab('altitude')">📈 Altitude History</button>
  <button onclick="showTab('category')">🗂 Satellite Category</button>
  <button onclick="showTab('distribution')">🌌 Orbital Distribution</button>
  <button onclick="showTab('starlink')">⭐ Starlink Plot</button>
</div>

<div id="globe" class="tab-content active">
  <iframe src="globe_tracks.html"></iframe>
</div>
<div id="ground" class="tab-content">
  <iframe src="ground_tracks.html"></iframe>
</div>
<div id="altitude" class="tab-content">
  <iframe src="historical_orbital_parameters.html"></iframe>
</div>
<div id="category" class="tab-content">
  <iframe src="satellite_altitude_by_category.html"></iframe>
</div>
<div id="distribution" class="tab-content">
  <iframe src="orbital_distributions_titles_higher.html"></iframe>
</div>
<div id="starlink" class="tab-content">
  <iframe src="starlink_interactive_satellite_plot.html"></iframe>
</div>

<script>
function showTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(div => div.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(btn => btn.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  event.currentTarget.classList.add('active');
}
</script>

</body>
</html>
