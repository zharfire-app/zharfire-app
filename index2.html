<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Satellite Overview</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  #globeViz { width: 100vw; height: 100vh; }
  .info {
    position: fixed;
    top: 10px; left: 10px;
    color: white;
    font-family: Arial, sans-serif;
    background: rgba(0,0,0,0.5);
    padding: 8px 12px;
    border-radius: 6px;
  }
</style>
</head>
<body>
<div id="globeViz"></div>
<div class="info">Satellite Overview - Stations (CelesTrak)</div>

<!-- Libraries -->
<script src="https://unpkg.com/three/build/three.min.js"></script>
<script src="https://unpkg.com/three-globe"></script>
<script src="https://unpkg.com/satellite.js/dist/satellite.min.js"></script>

<script>
// --- Setup Scene ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.z = 400;

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('globeViz').appendChild(renderer.domElement);

// --- Add Globe ---
const world = Globe()
  .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
  .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png');
scene.add(world);

// Lighting
const ambientLight = new THREE.AmbientLight(0xbbbbbb);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
directionalLight.position.set(1,1,1);
scene.add(directionalLight);

// --- Parse TLE Data ---
function parseTLEData(data) {
  const lines = data.trim().split('\n');
  const sats = [];
  for (let i = 0; i < lines.length; i += 3) {
    sats.push({
      name: lines[i].trim(),
      line1: lines[i+1].trim(),
      line2: lines[i+2].trim()
    });
  }
  return sats;
}

// --- Convert TLE to lat/lon ---
function getPosition(satrec, date) {
  const pv = satellite.propagate(satrec, date);
  if (!pv.position) return null;
  const gmst = satellite.gstime(date);
  const geo = satellite.eciToGeodetic(pv.position, gmst);
  return {
    lat: satellite.degreesLat(geo.latitude),
    lng: satellite.degreesLong(geo.longitude),
    alt: geo.height
  };
}

// --- Animate Satellites ---
fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle')
  .then(res => res.text())
  .then(data => {
    const satData = parseTLEData(data);
    const satRecs = satData.map(s => satellite.twoline2satrec(s.line1, s.line2));

    const satMarkers = satRecs.map(() => ({lat: 0, lng: 0, size: 0.5, color: 'red'}));
    world.pointsData(satMarkers);

    function update() {
      const now = new Date();
      satRecs.forEach((rec, i) => {
        const pos = getPosition(rec, now);
        if (pos) {
          satMarkers[i].lat = pos.lat;
          satMarkers[i].lng = pos.lng;
        }
      });
      world.pointsData(satMarkers);
    }

    // Update every second
    setInterval(update, 1000);
  });

// --- Animate Scene ---
(function animate() {
  requestAnimationFrame(animate);
  world.rotation.y += 0.0005; // slow spin
  renderer.render(scene, camera);
})();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
